name: project_mobile_pdam
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  another_flushbar: ^1.12.32
  dio: ^5.9.0
  equatable: ^2.0.5
  filter_list: ^1.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  get_it: ^8.0.3
  flutter_google_maps_webservices: ^1.1.1
  flutter_hooks: ^0.21.3+1
  flutter_slidable: ^4.0.3
  geolocator: ^14.0.2
  google_maps_flutter: ^2.13.1
  google_places_flutter: ^2.1.1
  hugeicons: ^1.1.0
  iconsax_flutter: ^1.0.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  location: ^8.0.1
  path: ^1.9.1
  retrofit: ^4.7.3
  flutter_secure_storage: ^9.2.4
  flutter_to_pdf: ^0.4.1
  pdf: ^3.12.0
  printing: ^5.13.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  retrofit_generator: ^10.0.6
  build_runner: ^2.9.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/icons/
    - assets/images/
    - assets/images/Pipe/
    - assets/images/Fitting/
    - assets/images/SR/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_pdam.png"
  # Adaptive icon (Android 8.0+): logo di depan, latar putih
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_pdam.png"
  min_sdk_android: 21
